<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NikanX builds customized AI agents, smart automation, and intelligent robotic solutions."
    />
    <title>NikanX | Tailored AI Agents &amp; Robotic Innovations</title>
    <style>
      :root {
        --bg: #f7f8fa;
        --text: #14171f;
        --muted: #5b6272;
        --accent: #2457f5;
        --line: #e2e5eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1117;
          --text: #eef0f4;
          --muted: #9aa3b5;
          --accent: #7b9bff;
          --line: #232836;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 24px;
      }
      .brand {
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 24px;
      }
      h1 {
        font-size: clamp(2rem, 6vw, 3.25rem);
        line-height: 1.15;
        margin: 0 0 20px;
      }
      p.lead {
        font-size: 1.15rem;
        color: var(--muted);
        margin: 0 0 32px;
        max-width: 56ch;
      }
      a.button {
        align-self: flex-start;
        padding: 12px 24px;
        border-radius: 8px;
        background: var(--accent);
        color: var(--bg);
        font-weight: 600;
        text-decoration: none;
      }
      a.button:hover {
        opacity: 0.9;
      }
      footer {
        border-top: 1px solid var(--line);
        padding: 20px 24px;
        text-align: center;
        font-size: 0.9rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">NikanX</p>
      <h1>Tailored AI Agents and Robotic Innovations</h1>
      <p class="lead">
        We build customized AI agents, smart automation systems, and
        intelligent solutions, crafted for your real-world needs.
      </p>
    </main>
    <footer>&copy; 2026 NikanX &middot; Munich</footer>
  </body>
</html>
