server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Cloud Run terminates HTTPS; keep redirects relative so they stay on https.
    absolute_redirect off;
    server_tokens off;

    # One canonical address: www.nikanx.com -> nikanx.com
    if ($host = www.nikanx.com) {
        return 301 https://nikanx.com$request_uri;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    # Short cache for pages (5 min), longer for images and CSS (1 day).
    set $cache "public, max-age=300";
    if ($uri ~* \.(png|ico|svg|css)$) {
        set $cache "public, max-age=86400";
    }

    add_header Cache-Control $cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
